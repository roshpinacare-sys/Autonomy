#
# network-awareness — הרשת מביטה בעצמה (T24, מילת-הבעלים: "הרשת לא מודעת לעצמה
# וליכולות הריבוניות האוטונומיות שלה").
# כל 30 דק': קנסוס-מלא של המשק (גילוי-ריפואים-וזרימות-חדשות שהבעלים בונה) ·
# מבחן-עצמאות-מלאה-מסנדבוקס (schedule+dispatch לכל-critical) · תלונות-כישלונות
# לתיבת-הלאוטונומיה (לא למייל-הבעלים) · פנקס-מודעות מתפרסם ב-HEAD.
# אפס-מפתחות · אפס-סודות-בפלט · זהות-אחת · כשל-כן.
#
name: network-awareness

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  # trigger-hardening (measured 2026-10-14): the '13,43' cron has exactly ONE run
  # in history — the manual dispatch (22:22Z); scheduled ticks 22:43/23:13/23:43/00:13
  # never landed. Same measured disease as compute-rearm (T-REARM hardening): a
  # self-awareness heart that can silently skip is not a heart. Two VERIFIED
  # frequent beats in this repo now double as the pulse: artery-watch
  # (repository_dispatch ~30min) and artery-flow (hourly schedule). Cheap by law —
  # the run re-measures and publishes honestly even when nothing changed.
  workflow_run:
    workflows: ["artery-watch", "artery-flow"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: network-awareness
  cancel-in-progress: false

jobs:
  awareness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: the network looks at itself (census + independence + claims + manifest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/network-awareness.mjs
