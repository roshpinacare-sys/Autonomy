name: artery-defi
# ═══════════════════════════════════════════════════════════════════════════
# ARTERY-DEFI · R362 FLOW-CONTINUATION — the push layer for the walled Defi book.
# ───────────────────────────────────────────────────────────────────────────
# Owner word (2026-10-15): "open all economic barriers — everything runs and
# flows". Measured: Defi is PRIVATE → its workflows sit disabled_manually
# (the billing wall: canary was a 1s chirp, never allowed to run). The hunter
# (mini-services/hunter) dispatched it every 6h and reported honestly; the
# gate has been frozen since. Fleet covenant (fleet-verify): "the artery is
# the push layer for walled repos". This artery IS that layer for Defi:
#   1. clone Defi (private) with ECO_WALLET_TOKEN
#   2. measure the fleet truth from the clone: KPI.json (ladder · revenue),
#      MISSION-1000.md, KPI-history freshness — zero synthesis, copy only
#   3. daily KPI snapshot: KPI-history/<UTC-date>.json = the measured
#      KPI.json (only if absent — history flows again, values verbatim)
#   4. canary receipt: fleet/canary/receipt.json (measured sha16 · ladder ·
#      history state · artery pulse) — the chirp lives in the public run log
#   5. push back to Defi main (giant books route reads KPI.json live)
#   6. leak-scan the receipt (fail-closed) + honest verdict law
# Cadence: every 6h at :17 — the hunter's original rhythm, restored.
# Verdict PASS unless a real defect; BLOCKED-SILENT when the token is absent
# (designed waiting, receipt honest — never a fake green).
# ═══════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artery-defi
  cancel-in-progress: false

jobs:
  defi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ECO_WALLET_TOKEN: ${{ secrets.ECO_WALLET_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: clone the walled Defi + measure the fleet truth (public artery = push layer)
        if: ${{ env.ECO_WALLET_TOKEN != '' }}
        run: |
          set -Eeuo pipefail
          git clone --depth 1 "https://x-access-token:${ECO_WALLET_TOKEN}@github.com/roshpinacare-sys/Defi" defi
          cd defi
          mkdir -p fleet/canary
          node - <<'NODE'
          const { readFileSync, writeFileSync, existsSync, copyFileSync, readdirSync } = require("fs");
          const { createHash } = require("crypto");
          const kpiRaw = readFileSync("fleet/KPI.json", "utf8");
          const kpi = JSON.parse(kpiRaw);
          const kpiSha16 = createHash("sha256").update(kpiRaw).digest("hex").slice(0, 16);
          const histDir = "fleet/KPI-history";
          const hist = existsSync(histDir) ? readdirSync(histDir).filter(f => f.endsWith(".json")).sort() : [];
          const today = new Date().toISOString().slice(0, 10);
          let snapshotted = false;
          if (!hist.includes(`${today}.json`)) {
            copyFileSync("fleet/KPI.json", `${histDir}/${today}.json`);
            snapshotted = true;
          }
          const missionExists = existsSync("fleet/MISSION-1000.md");
          const receipt = {
            measuredAt: new Date().toISOString(),
            artery: "artery-defi (Autonomy public push layer, covenant fleet-verify)",
            kpiSha16,
            ladder: { current: kpi?.ladder?.current ?? null, next: kpi?.ladder?.next ?? null, proven: kpi?.ladder?.proven ?? null },
            revenuePerDayRealUsd: typeof kpi?.revenuePerDayReal?.usd === "number" ? kpi.revenuePerDayReal.usd : null,
            mission1000: missionExists ? "present" : "absent",
            historyCount: hist.length + (snapshotted ? 1 : 0),
            historyLatest: hist.length ? hist[hist.length - 1].replace(".json", "") : null,
            snapshotToday: snapshotted,
            gate: "chirp — the canary lives in the public artery run log (walled repo, wall bypassed by covenant)",
          };
          writeFileSync("fleet/canary/receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log("defi fleet truth measured:", JSON.stringify({ kpiSha16, ladder: receipt.ladder, revenue: receipt.revenuePerDayRealUsd, snapshotToday: snapshotted, historyCount: receipt.historyCount }));
          NODE
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add fleet/canary fleet/KPI-history
          if git diff --cached --quiet; then
            echo "no defi state change this round (honest)"
          else
            git commit -m "artery-defi: fleet truth @ $(date -u +%FT%TZ) (measured verbatim · zero synthesis · canary chirp via public artery R362)" [skip ci]
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash origin main && git push origin main; then echo "defi state push ok (attempt $i)"; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - name: leak-scan (fail-closed)
        if: always()
        run: |
          mkdir -p receipts/defi
          [ -f defi/fleet/canary/receipt.json ] && cp defi/fleet/canary/receipt.json receipts/defi/ 2>/dev/null || true
          if [ -f receipts/defi/receipt.json ]; then
            node engine/leak-scan.mjs receipts/defi/receipt.json
          else
            echo "leak-scan: no defi receipt this round (honest)"
          fi

      - name: verdict law (red unless PASS or BLOCKED-SILENT)
        if: always()
        run: |
          if [ -z "$ECO_WALLET_TOKEN" ]; then
            echo "artery-defi BLOCKED — ECO_WALLET_TOKEN absent (BLOCKED-SILENT LAW v2: designed waiting, receipt honest)"
            exit 0
          fi
          [ -d defi ] || { echo "defi clone never happened — real defect, run stays red"; exit 1; }
          [ -f defi/fleet/canary/receipt.json ] || { echo "receipt never landed — real defect, run stays red"; exit 1; }
          echo "artery-defi PASS — fleet truth measured verbatim, canary chirped via the public artery, history flows (or honestly unchanged)"
