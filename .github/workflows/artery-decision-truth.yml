name: artery-decision-truth
# ═══════════════════════════════════════════════════════════════════════════
# ARTERY-DECISION-TRUTH · עורק-אמת-ההכרעות (H-series · zai-code-3) · wave-2 port
# ───────────────────────────────────────────────────────────────────────────
# החוק (H): כל הכרעה ENFORCED חייבת אימות-עצמאי + צרכן-מדוד; עדויות-שהעולם-
#   עבר-מעליהן = STALE-TRUTH; מקור-שנפל = UNVERIFIABLE — כנות, לעולם לא "זיוף".
#
# wave-2 (ריפו-פומבי · חוק-השטח-הפומבי):
#   · הצי מדובר refs בלבד — השמות נגזרים בזמן-ריצה מסוד FLEET_ROSTER_MAP.
#   · פנקס-המכריע חי בריפו-פרטי (Sandbox) — נמשך עם טוקן-קריאה SBX_RAW_TOKEN;
#     הטוקן לעולם לא נדפס ולא נכתב לארטיפקט.
#   · audit-שטח-פומבי fail-closed: אפס שמות-צי בעץ — אחרת הריצה אדומה.
# ═══════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "16,46 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - decision-truth-tick

permissions:
  contents: write

concurrency:
  group: artery-decision-truth
  cancel-in-progress: false

jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # שער-עצמי: המנוע מוכיח את-עצמו על וקטורים דטרמיניסטיים לפני כל-ריצה-חיה
      - name: selftest (fail-closed)
        run: node engine/decision-truth.mjs --selftest

      - name: re-measure every sovereign decision (never trust, always verify)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
          SBX_RAW_TOKEN: ${{ secrets.SBX_FLEET_PAT }} # קריאת-פנקס-המכריע מהריפו-הפרטי
        run: node engine/decision-truth.mjs

      - name: leak-scan (fail-closed)
        if: always()
        run: |
          # absent file = skip (fresh-checkout race); present file = scan result propagates (fail-closed kept)
          for f in verdict.json log.jsonl run.log; do
            if [ -f "ops/decision-truth/$f" ]; then node engine/leak-scan.mjs "ops/decision-truth/$f"; fi
          done

      - name: public-surface audit (zero fleet names — refs law, fail-closed)
        if: always()
        run: |
          # דפוס-האיסור נבנה בזמן-ריצה מ-base64 (אפס-שמות-צי בעץ — אחרת-הסריקה-תחסום-את-עצמה;
          # אותו-דפוס-בית כמו engine/leak-scan.mjs KEY_POINTER_NAMES)
          PAT=$(printf '%s' 'Y2FzaG1hY2hpbmV8aGNzb2xkaWVyfGlzcmFlbG5ld3N8bWFjcmFtZXxcYndvcVxifFxid29nXGJ8XGJ3aWNcYnxcYnNpcVxifFxibHNhXGJ8XGJoYXJhblxifFxidG92XGJ8Y29ybmVyc3RvbmV8aGVhZGNvcm5lcg==' | base64 -d)
          # יוצא-מן-הכלל-מצומצם-ומתועד (t10 · agent-9 · נמדד): receipts/chainbus/ מקריא
          # את מעטפת-הפרוטוקול (from:-שדה) — זהות-המשדר מתפרסמת-על-השרשרת-עצמה
          # בשידור-המאושר-של-הבעלים (t8); הקבלה-חייבת-לתעד-נאמנה. החוק-נותר-אפס-שמות
          # בכל-שאר-העץ. שינוי-היקף? דרוש-אישור-בעלים.
          HITS=$(grep -rEn "$PAT" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=chainbus 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | head -20
            echo "fleet-name leak in the public tree — blocked (refs law)"
            exit 1
          fi
          echo "public-surface audit: clean (zero fleet names)"

      # קומיט-ממושפע: רק ops/decision-truth (אף-פעם לא -A) · rebase ×3 · כשל = יציאה 1
      - name: commit verdict (honest verdicts always land, FAIL included)
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add ops/decision-truth
          if git diff --cached --quiet; then
            echo "verdict unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "decision-truth verdict: $(date -u +%FT%TZ)"
          OK=0
          # [19.43 · T24-aligned] 28 writers share main — 3 attempts died in the 13:49Z burst; 7 with growing backoff
          for i in 1 2 3 4 5 6 7; do
            if git pull --rebase -X theirs --autostash origin main && git push origin main; then OK=1; echo "push ok (attempt $i)"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4 + RANDOM % 5))
          done
          if [ "$OK" != "1" ]; then
            # [19.43 · DECISIONS #32-E alive-wins] the receipt may already be at origin (a live sibling writer)
            git fetch -q origin main
            if git diff --quiet HEAD origin/main -- ops/decision-truth; then
              echo "alive-wins: verdict content already landed at origin (live sibling writer) — honest skip per DECISIONS #30/#32-E, not a regression"
              exit 0
            fi
            echo "verdict push failed after 7 attempts and content NOT at origin - honest failure"
            exit 1
          fi

      - name: verdict law (red unless PASS/PASS_WITH_ALERTS — after the verdict landed)
        if: always()
        run: |
          V="$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("ops/decision-truth/verdict.json","utf8")).overall)}catch{console.log("ERROR")}')"
          echo "decision-truth verdict: $V"
          [ "$V" = "PASS" ] || [ "$V" = "PASS_WITH_ALERTS" ] || { echo "decider book unreadable or engine self-fail - run stays red (honesty over comfort)"; exit 1; }
