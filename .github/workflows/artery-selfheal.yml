name: artery-selfheal
# THE-AUTONOMOUS-LUNG [t10 · agent-9 · owner law: "להפעיל-לא-לסגור-ולצמצם"]
# verifier (cron 7,37) publishes state/verifier/verdict-latest.json;
# this lung (cron 11,41) reads it and RE-IGNITES every stale artery by dispatch.
# Authority is DELIBERATELY minimal: dispatch only — enable/disable stays
# constitution-level (owner-only). Disabled workflows are reported loudly, never
# silently re-armed by the organism itself. Receipts: receipts/self-heal/.
on:
  schedule:
    - cron: "11,41 * * * *"   # 4min after verifier slot — reads the freshest verdict
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: artery-selfheal
  cancel-in-progress: false
jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read verdict & re-ignite stale arteries (dispatch-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node engine/self-heal.mjs
      - name: Commit receipt (only when changed · rebase-safe · HONEST push)
        run: |
          if [ -n "$(git status --porcelain receipts/self-heal)" ]; then
            git config user.name sovereign-agent-9
            git config user.email agent9@fleet.local
            git add receipts/self-heal
            git commit -m "self-heal: lung receipt [run ${{ github.run_id }}]"
            ok=0
            for i in 1 2 3; do git push origin main && { ok=1; break; } || { sleep $((i*7)); git pull --rebase origin main || true; }; done
            [ "$ok" = 1 ] || { echo "push failed after 3 retries — FAILING LOUDLY (no silent-green)"; exit 1; }
          fi
