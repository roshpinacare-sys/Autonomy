name: artery-scout
# איבר-הצייד [t12 · agent-9 · owner order: track developments, let the
# architecture study & engineer from them, NEVER fall into malicious code,
# turn everything into OUR originals]. Runs the learning pipeline:
# sources → fetch-ladder → vet (malicious-code corpus, read-only) →
# knowledge entries (clean-room proposals) → receipts.
# Laws: knowledge/LEARNING.md
on:
  schedule:
    - cron: "18 5,14 * * *"   # 2x daily
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: artery-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run the learning pipeline (fetch → vet → learn)
        env:
          GITHUB_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
        run: node engine/scout.mjs
      - name: Commit knowledge + receipts (only when changed · rebase-safe · honest push)
        run: |
          if [ -n "$(git status --porcelain receipts/scout knowledge/scout state/scout)" ]; then
            git config user.name sovereign-agent-9
            git config user.email agent9@fleet.local
            git add receipts/scout knowledge/scout state/scout
            git commit -m "scout: knowledge run [run ${{ github.run_id }}]"
            ok=0
            for i in 1 2 3; do git push origin main && { ok=1; break; } || { sleep $((i*7)); git pull --rebase origin main || true; }; done
            [ "$ok" = 1 ] || { echo "push failed after 3 retries — FAILING LOUDLY (no silent-green)"; exit 1; }
          fi
