name: agent-9-vault-sync
# [t18 · agent-9] כספת-הביטוח · v3 — יושר-לדוקטרינת-18b.
# לקח-18b: ענף-צדדי ב-steem (agent-9-insurance) אוכלס ע"י floating-builds organ
# [R54-אפס-רחיפה] — שלוחות-זרות מאוכסנות לתג archive/* → מלחמת-התקפלות אינסופית.
# נתיבי-עץ עדיפים על ענפים-צדדיים: הכספת = agents/agent-9-insurance/ על main
# ב-saos-runtime (פרטי), נמשכת יומית מ-Autonomy (vault-sync v2 המקומי שם).
# v3 כאן = עותק-גיבוי עצמאי ל-v2 מהצד-השני (Autonomy דוחף → saos-runtime):
# אם GITHUB_TOKEN של saos-runtime ייכשל יום-אחד, הסינכרון עדיין יקרה מכאן
# עם סולם-token (SBX_FLEET_PAT→GH_PAT→ZIP_PAT). שני-הכותבים כותבים בייטים-זהים:
# מי שרץ-שני מוצא אין-שינוי → פעימה-שקטה. cron 03:47 אחרי-v2 (03:31) — אין-מירוץ.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: agent-9-vault-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: push insurance snapshot to saos-runtime tree path (idempotent, no side branches)
        env:
          SBX_FLEET_PAT: ${{ secrets.SBX_FLEET_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: |
          set -e
          WORK=""
          for T in "$SBX_FLEET_PAT" "$GH_PAT" "$ZIP_PAT"; do
            [ -n "$T" ] || continue
            if git ls-remote "https://x-access-token:${T}@github.com/roshpinacare-sys/saos-runtime.git" HEAD >/dev/null 2>&1; then
              WORK="$T"; echo "token ok (ls-remote saos-runtime)"; break
            fi
            echo "token rejected — trying next on ladder"
          done
          [ -n "$WORK" ] || { echo "NO_WORKING_TOKEN for saos-runtime — FAIL LOUD"; exit 1; }
          test -d agents/agent-9 || { echo "INSURANCE_SOURCE_MISSING (agents/agent-9) — FAIL LOUD"; exit 1; }
          git clone --depth 1 "https://x-access-token:${WORK}@github.com/roshpinacare-sys/saos-runtime.git" vault
          rm -rf vault/agents/agent-9-insurance
          mkdir -p vault/agents/agent-9-insurance
          cp -r agents/agent-9/. vault/agents/agent-9-insurance/
          cd vault
          git config user.name sovereign-agent-9
          git config user.email agent9@fleet.local
          git add agents/agent-9-insurance
          if git diff --cached --quiet; then echo "vault already fresh — quiet beat (v2 converged first)"; exit 0; fi
          git commit -q -m "vault-sync v3 (from Autonomy): agent-9 insurance snapshot (worklog+tools+manifest)"
          for i in 1 2 3; do
            git pull --rebase origin main -q || true
            git push origin HEAD:main -q && { echo VAULT_SYNCED_OK_V3; exit 0; }
            sleep $((i*7))
          done
          echo VAULT_PUSH_FAILED_LOUD; exit 1
