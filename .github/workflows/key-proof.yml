# ═══════════════════════════════════════════════════════════════════════════
# KEY-PROOF — הוכחה-עומדת של מתים (R11 · task 11-a) · weekly refresh · wave-2 port
# ═══════════════════════════════════════════════════════════════════════════
# קריאה-בלבד בשרשרת ובהיסטוריית-git. אפס-שידורים. אפס-כתיבות-שרשרת. אפס-כספת.
# המנוע סורק בעצמו את 5 ריפואי-הדליפה הציבוריים (אין צורך ב-fetch-depth: 0 —
# ה-checkout כאן הוא רק לקבלת proof/key-proof.mjs; הסריקה מקלננת מטרות משלה).
#
# חוק-הצנזורה (ברזל, בקוד): לארטיפקט נכתבים רק sha256-16hex של החומר + מפתחות-
# ציבוריים + מטא-דאטה של מקום. אף חומר-פרטי, אף סיסמה, אף תוכן-קובץ. ה-auditor
# רץ לפני-כתיבה — הפרה = כשל-קשה, כלום לא נכתב.
#
# wave-2 (ריפו-פומבי · חוק-השטח-הפומבי): הצי מדובר refs בלבד — השמות נגזרים
# בזמן-ריצה מסוד FLEET_ROSTER_MAP; הארטיפקט נכתב דרך scrubAll.
#
# GITHUB_TOKEN (repo-scoped) מוזרם כ-env — המנוע קורא GITHUB_TOKEN/KP_TOKEN,
# לעולם לא מדפיס אותו, ומשתמש בו רק לקלונים של ריפואים ציבוריים.
#
# ALIVE-ALERT = אזעקה: החומר הדלוף מאשר רשות-חיה → הארטיפקן צורח
# (summary.incident=true) — אין-טיפול-אוטומטי; החלטת-owner+orchestrator בלבד.
# ═══════════════════════════════════════════════════════════════════════════
name: key-proof

on:
  schedule:
    - cron: "23 4 * * 3" # שבועי · יום-ד' 04:23 UTC — דקה-אי-זוגית
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Selftest gate (zero network, zero scan — must be 26/26)
        run: node proof/key-proof.mjs --selftest

      - name: Live proof (scan 5 leak-repos → derive → chain read-only → verdicts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
          # wave-2: 5 ריפואי-הדליפה פרטיים — הסריקה עצמה עוגנת-אמת רק עם טוקן-קריאה.
          # המנוע מצנזר את-עצמו (hash16 בלבד בארטיפקט) ולעולם לא מדפיס את הטוקן.
          # בלי-טוקן הריצה נשארת כנה: SCAN-DEGRADED + עדויות-שרשרת מתרעננות.
          KP_TOKEN: ${{ secrets.SBX_FLEET_PAT }}
        run: node proof/key-proof.mjs

      - name: public-surface audit (zero fleet names — refs law, fail-closed)
        if: always()
        run: |
          # דפוס-האיסור נבנה בזמן-ריצה מ-base64 (אפס-שמות-צי בעץ — אחרת-הסריקה-תחסום-את-עצמה;
          # אותו-דפוס-בית כמו engine/leak-scan.mjs KEY_POINTER_NAMES)
          PAT=$(printf '%s' 'Y2FzaG1hY2hpbmV8aGNzb2xkaWVyfGlzcmFlbG5ld3N8bWFjcmFtZXxcYndvcVxifFxid29nXGJ8XGJ3aWNcYnxcYnNpcVxifFxibHNhXGJ8XGJoYXJhblxifFxidG92XGJ8Y29ybmVyc3RvbmV8aGVhZGNvcm5lcg==' | base64 -d)
          HITS=$(grep -rEn "$PAT" . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | head -20
            echo "fleet-name leak in the public tree — blocked (refs law)"
            exit 1
          fi
          echo "public-surface audit: clean (zero fleet names)"

      - name: Commit refreshed proof/out (receipt = commit; rebase loop ×5)
        if: always()
        run: |
          set -u
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add proof/out
          if git diff --cached --quiet; then
            echo "no artifact change — clean exit"
          else
            git commit -m "[key-proof] standing proof refreshed: $(date -u +%FT%TZ) [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main && ok=1 && break
              echo "push attempt $i failed — re-pull --rebase and retry"
              sleep $((i * 10))
            done
            test "$ok" = "1" || { echo "push failed after 5 rebase attempts"; exit 1; }
          fi

      - name: Honest exit (incident verdict must stay loud)
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("proof/out/KEY-PROOF-LATEST.json"))
          except Exception as e:
              print("proof artifact unreadable — honest red:", e)
              raise SystemExit(1)
          s = d["summary"]
          print(f"verdicts: DEAD={s['DEAD']} ALIVE-ALERT={s['ALIVE-ALERT']} UNKNOWN={s['UNKNOWN']} UNKNOWN-NOT-CHAIN-TESTABLE={s['UNKNOWN-NOT-CHAIN-TESTABLE']} incident={s['incident']}")
          if s["incident"]:
              print("🚨 ALIVE-ALERT present — see verdicts in artifact; owner+orchestrator decision required")
          EOF
