name: artery-growth
# איבר-הצמיחה [t13 · agent-9 · owner order: "בקרוב אני הולך לישון... משאירים
# את הארכיטקטורה לעבוד לבד רב-תחומית על הכל... רק לוודא התפתחות וגדילה
# ולא סגירה, המנעות, נעילה וקיפול של המערכת"]
# ═════════════════════════════════════════════════════════════════════════
# THE NO-CLOSURE COVENANT, checked daily: arteries still active (GitHub
# auto-disable watch), product surfaces fresh, LIVE site serving the pulse,
# receipts flowing, backlog alive. Any closure signal → LOUD failure
# (exit 2) + receipt — the opposite of silent shrinkage.
on:
  schedule:
    - cron: "19 6 * * *"   # daily 06:19 UTC — Jerusalem 09:19, before the day starts
  workflow_dispatch: {}
permissions:
  contents: write   # growth receipt push (covenant read-only vs code; census uses API via PAT)
concurrency:
  group: artery-growth
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run the no-closure covenant
        env:
          GITHUB_TOKEN: ${{ secrets.FLEET_PAT || secrets.GITHUB_TOKEN }}
          SITE_BASE: https://roshpinacare-sys.github.io/Domain
        run: node engine/growth-watch.mjs
      - name: Commit growth receipt (only when changed · rebase-safe · honest push)
        run: |
          if [ -n "$(git status --porcelain receipts/growth)" ]; then
            git config user.name sovereign-agent-9
            git config user.email agent9@fleet.local
            git add receipts/growth
            git commit -m "growth: covenant receipt [run ${{ github.run_id }}]"
            ok=0
            for i in 1 2 3; do git push origin main && { ok=1; break; } || { sleep $((i*7)); git pull --rebase origin main || true; }; done
            [ "$ok" = 1 ] || { echo "push failed after 3 retries — FAILING LOUDLY (no silent-green)"; exit 1; }
          fi
