name: directive-bus
# CHAIN-BUS CONSUMER — keyless, hostless, autonomous.
# Transport = Steem chain (saos-bus-v1 custom_json, read via public RPC).
# Compute   = this free public-repo VM (replaceable — the consumer is zero-dep node).
# State     = git receipts (a committed receipt = directive already consumed).
# Owner sends directives with his OWN posting-key tooling (steem/signer.mjs stack);
# no key material ever reaches this repo or this VM.
on:
  schedule:
    - cron: "*/30 * * * *"   # heartbeat + directive scan (public repo = free minutes)
    - cron: "13,43 * * * *"  # resilience lane 1 (wave-7 agent-9, measured 2026-10-17:
                             # GitHub silently DROPS schedules on this busy repo — the
                             # consumer sat 18:44→21:20 with zero runs at 19:14/19:44/
                             # 20:14/20:44/21:14 while directives waited on-chain)
    - cron: "27,57 * * * *"  # resilience lane 2 — over-fire is SAFE by design:
                             # git-native dedup (committed receipt = consumed) +
                             # concurrency queue + idempotent read-only task roster
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: directive-bus
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Scan chain bus & consume directives
        id: scan
        run: node engine/directive-bus.mjs
      - name: Commit receipts (only when changed)
        run: |
          if [ -n "$(git status --porcelain receipts/chainbus receipts/execution)" ]; then
            git config user.name sovereign-agent-9
            git config user.email agent9@fleet.local
            git add receipts/chainbus receipts/execution
            git pull --rebase origin main || true
            git commit -m "chainbus: scan/consume receipts [run ${{ github.run_id }}]"
            git push origin main
          else
            echo "no receipt change — heartbeat only"
          fi
